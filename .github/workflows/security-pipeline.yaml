name: Security Pipeline
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  semgrep:
    name: SAST - Semgrp
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Run Semgrep
      run: semgrep scan --config p/owasp-top-ten --config p/security-audit --error .

  gitleaks:
    name: Secret Scan - Gitleaks
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Run Gitleaks
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITLEAKS_ENABLE_COMMENTS: false

  trivy-image:
    name: Container Scan - Trivy
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Trivy on Juice Shop image
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: bkimminich/juice-shop:latest
        format: table
        severity: CRITICAL,HIGH
        exit-code: '1'

  trivy-sbom:
    name: SBOM Generation - Syft
    runs-on: ubuntu:latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Syft
      run: curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

    - name: Generate SBOM for Juice Shop image
      run: syft bkimminich/juice-shop:latest -o cyclonedx-json > sbom-juice-shop.json

    - name: Upload SBOM as artifact
      uses: actions/upload-artifact@v4
      with:
        name: sbom-juice-shop
        path: sbom-juice-shop.json
