name: Security Pipeline
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  semgrep:
    name: SAST - Semgrp
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Run Semgrep
      run: semgrep scan --config p/owasp-top-ten --config p/security-audit --error .

  gitleaks:
    name: Secret Scan - Gitleaks
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Run Gitleaks
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITLEAKS_ENABLE_COMMENTS: false
